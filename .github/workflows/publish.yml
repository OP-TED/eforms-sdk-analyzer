name: Publish package to the Maven Central Repository

on:
  push:
    branches:
      - 'develop'

  release:
    types: [published]

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Set up Java for publishing to Maven Central Repository
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Publish to the Maven Central Repository
        # maven.repository.credentialScope=id is required for snapshot deployment.
        # Recent Maven scopes a server's credentials to the origins of its id, and
        # the id 'central' carries the origin of Maven's built-in central
        # repository (https://repo.maven.apache.org). The snapshot repository is
        # https://central.sonatype.com/repository/maven-snapshots, so the origins
        # do not match, the credentials are withheld and the upload gets HTTP 401.
        # Release publication is unaffected: it goes through the Central Portal
        # API, not a Maven repository transfer.
        run: mvn --batch-mode deploy -Dmaven.repository.credentialScope=id -Prelease
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}

